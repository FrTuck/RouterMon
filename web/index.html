<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мониторинг роутера</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --border: rgba(11,11,11,0.10);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s7: #6250d6;
  --free: #dcdbd4;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  --link: #1c5cab; --hover: rgba(11,11,11,0.04); --sel: rgba(42,120,214,0.10);
  /* светофор: дуги — цвета статусов, цифры — более тёмные оттенки, чтобы читались на светлом фоне */
  --tl-good: #0ca30c; --tl-warn: #fab219; --tl-bad: #d03b3b; --tl-none: var(--axis);
  --tl-good-t: #087a08; --tl-warn-t: #a36a00; --tl-bad-t: #c2302f; --tl-none-t: var(--muted);
  --tl-neu: var(--s1); --tl-neu-t: var(--ink);
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { --tl-good-t: #34c234; --tl-warn-t: #fab219; --tl-bad-t: #f06262; } }
:root[data-theme="dark"] { --tl-good-t: #34c234; --tl-warn-t: #fab219; --tl-bad-t: #f06262; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --border: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9;
    --free: #3a3a37; --good-text: #0ca30c; --link: #86b6ef; --hover: rgba(255,255,255,0.05); --sel: rgba(57,135,229,0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --border: rgba(255,255,255,0.10);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9;
  --free: #3a3a37; --good-text: #0ca30c; --link: #86b6ef; --hover: rgba(255,255,255,0.05); --sel: rgba(57,135,229,0.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }

header { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--border); }
.bar { margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 650; font-size: 15px; white-space: nowrap; color: var(--ink); }
.brand:hover { text-decoration: none; color: var(--link); }
.help { position: relative; display: inline-flex; }
.help .gtip { left: 0; transform: none; top: 26px; width: max-content; max-width: min(420px, 86vw); }
.help .qbtn:hover + .gtip, .help .qbtn:focus-visible + .gtip, .help.open .gtip { display: block; }
.help .gtip b { color: var(--ink); }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--ink-2); min-width: 0; }
.crumbs .sep { color: var(--muted); }
.crumbs b { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.tools { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--sel); border-color: transparent; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--sel); font-weight: 600; }
.upd { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* узкий экран (телефон вертикально): кнопки отдельной строкой во всю ширину, «обновлено …» занимает остаток слева */
@media (max-width: 520px) {
  .bar { gap: 8px 10px; padding: 8px 12px; }
  .bar .spacer { display: none; }
  .tools { flex: 1 1 100%; min-width: 0; gap: 6px; }
  .tools .upd { flex: 1 1 auto; }
  .tools .btn { padding: 5px 9px; }
  #add .wide { display: none; }
  /* меню — во всю ширину под шапкой (header sticky, поэтому отсчёт от него) */
  .tools .dd { position: static; }
  .tools .dd-menu { left: 12px; right: 12px; width: auto; top: calc(100% - 4px); }
}
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: 1px; }
.dot.stale { background: var(--muted); }

/* страница — на всю ширину экрана */
main { margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 2px; font-weight: 650; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 13px; }
/* «Имя: IP · модель · …» — одной строкой; если не влезает, хвост обрезается многоточием */
.hline { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 auto; }
.hline h1 { margin: 0; white-space: nowrap; }
.hline .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.panel-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.panel-h .r { margin-left: auto; }
/* один отступ между всеми окнами страницы — по горизонтали и по вертикали */
:root { --gap: 12px; }
.grid { display: grid; gap: var(--gap); }
/* карточки роутеров: по 3 в ряд; если роутеров 1–2 — растягиваются на весь ряд */
/* сетка из 6 долей: карточка в полном ряду занимает 6/колонок, карточки неполного последнего ряда делят его поровну (layoutCards) */
.g-cards { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g-cards > .card { grid-column: span 2; }
/* сетка окон: 1, 2 или 3 равные колонки — у всех рядов страницы одни и те же границы колонок, поэтому промежутки
   между окнами сходятся прямым крестом */
.g-2, .g-12 { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1086px) { .g-2, .g-12 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1620px) { .g-2, .g-12 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g-12 > :last-child { grid-column: span 2; } }
.section { margin-top: var(--gap); }
/* «Интерфейсы» + «Топ адресов»: по той же сетке, что графики над ними; при трёх колонках топ занимает две */
.g-12 { align-items: start; }
/* два равных окна на всю ширину (графики приёма и передачи, окна процесса); на узком экране — одно под другим */
.g-eq { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .g-eq { grid-template-columns: minmax(0, 1fr); } }
/* вкладки страницы роутера */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tabs a { padding: 7px 14px; color: var(--ink-2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--s1); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.vol { display: inline-block; width: 40px; height: 6px; background: var(--surface-2); border-radius: 3px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
.vol i { display: block; height: 100%; border-radius: 3px; }
td.ck { width: 26px; padding-right: 0; }
td.ck input { margin: 0; cursor: pointer; }
.role { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
#td-tab th, #td-tab td { padding-left: 4px; padding-right: 4px; }
/* верхняя строка показателей — равномерно по всей ширине; на телефоне — по два в ряд */
.kpis.even { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; }
.kpis.even .kpi { min-width: 0; }
.kpis.even .kpi .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .kpis.even { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } }
a.kpi { color: inherit; border-radius: 8px; margin: -4px -6px; padding: 4px 6px; }
a.kpi:hover { text-decoration: none; background: var(--hover); }
a.kpi .l { color: var(--link); }
.sig-good { color: var(--tl-good-t); } .sig-warn { color: var(--tl-warn-t); } .sig-bad { color: var(--tl-bad-t); }
.err { background: var(--surface); border: 1px solid var(--critical); border-radius: 10px; padding: 12px 14px; }

/* карточка роутера */
/* subgrid: одинаковые блоки соседних карточек стоят на одной высоте, даже если где-то текст длиннее */
.card { cursor: pointer; transition: border-color .15s; display: grid; grid-template-rows: subgrid; grid-row: span 6; row-gap: 12px; align-content: start; }
.card > * { min-width: 0; }
.card:hover { border-color: var(--axis); }
.card-h { display: flex; gap: 10px; align-items: flex-start; }
.card-h .t { min-width: 0; flex: 1; }
.card-h .name { font-size: 17px; font-weight: 650; }
.card-h .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .foot { display: flex; justify-content: space-between; align-items: end; gap: 10px; }
.card .kpi .s, .card .kpi .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-size: 13px; }
.linkbtn:hover { text-decoration: underline; }
.trash { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; padding: 0; vertical-align: middle; }
.trash:hover { color: var(--critical); border-color: var(--border); background: var(--surface-2); }
/* «+ Добавить роутер» — выпадающий список: убранные роутеры + ввод IP */
.dd { position: relative; display: inline-flex; }
.dd-menu { display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 8; width: min(320px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 6px; }
.dd.open .dd-menu { display: block; }
.dd-menu .dh { font-size: 12px; color: var(--muted); padding: 6px 8px 4px; }
.dd-menu .di { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 8px; cursor: pointer; color: var(--ink); font: inherit; }
.dd-menu .di:hover, .dd-menu .di:focus-visible { background: var(--hover); outline: none; }
.dd-menu .di .ip { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.dd-menu .de { font-size: 13px; color: var(--muted); padding: 4px 8px 8px; }
.dd-menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
.dd-menu .dip { display: flex; gap: 6px; padding: 2px 4px 4px; }
.dd-menu .dip input { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; }

/* мастер добавления роутера */
dialog.modal { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog.modal::backdrop { background: rgba(0,0,0,.45); }
.modal .mh { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal .mh h2 { font-size: 16px; }
.modal .mb { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.modal .mf { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface); }
.modal input[type=text], .modal input[type=password] { font: inherit; color: inherit; background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 100%; }
.modal .row2 { display: flex; gap: 8px; }
.modal .row2 input { flex: 1; }
.btn.primary { background: var(--s1); color: #fff; border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--s1); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.access { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.access h3 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.access .opt { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
.access p { margin: 0; font-size: 13px; color: var(--ink-2); }
.access p b { color: var(--ink); font-weight: 600; }
.access ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.access .risk { border-left: 3px solid var(--serious); padding-left: 10px; }
.access label.ok { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 600; margin-top: 4px; cursor: pointer; }
.checks svg { width: 14px; height: 14px; }
.checks { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; align-items: center; }
.msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-start; }
.msg svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.msg pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 11.5px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 14px; }
.kpi .l { font-size: 12px; color: var(--ink-2); }
.kpi .v { font-size: 22px; font-weight: 600; line-height: 1.2; }
.kpi .v small { font-size: 13px; font-weight: 500; color: inherit; opacity: .8; margin-left: 2px; }
.kpi .s { font-size: 12px; color: var(--muted); }
.sparks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.spark .l { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; }
/* мини-графики растягиваются по высоте, если карточкам досталось свободное место */
.sparks.grow { align-items: stretch; }
/* каждый мини-график — отдельная рамка: заголовок, шкала слева, сам график */
.sparks.grow { gap: 14px; }
.spark { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px 8px; gap: 4px; }
.spk { flex: 1 1 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; min-height: 48px; }
.spk-y { position: relative; min-width: 30px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.spk-y span { position: absolute; right: 0; transform: translateY(-50%); white-space: nowrap; line-height: 1; }
.spark svg { display: block; width: 100%; height: 100%; min-height: 48px; overflow: visible; }
/* сворачиваемая панель */
.fold-h { cursor: pointer; user-select: none; margin-bottom: 0; }
.fold-h .chev { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
.fold.open .fold-h { margin-bottom: 10px; }
.fold.open .fold-h .chev { transform: rotate(90deg); }
.fold:not(.open) .fold-b { display: none; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.disk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 12.5px; }
.disk .meter { grid-column: 1 / -1; margin-bottom: 4px; }

/* значки состояния — всегда в один ряд: при нехватке места сжимается текст (полный — во всплывающей подсказке), а не переносится строка */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; color: var(--ink); min-width: 0; flex: 0 1 auto; }
.badge span { overflow: hidden; text-overflow: ellipsis; }
.badge svg { width: 12px; height: 12px; flex: none; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; justify-content: flex-end; min-width: 0; flex: 0 1 auto; }
.card-h .badges { max-width: 62%; }

/* таблицы */
.tbl-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; user-select: none; position: sticky; top: 0; background: var(--surface); }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--ink); }
th.on::after { content: " ▾"; }
th.on.asc::after { content: " ▴"; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
tr.grp td { font-weight: 600; }
tr.member td:first-child { padding-left: 26px; }
tr.gone td { color: var(--muted); }
.pname { font-weight: 600; }
.pcmd { color: var(--muted); font-size: 12px; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.cpubar { display: inline-block; width: 46px; height: 6px; background: var(--surface-2); border-radius: 3px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
.cpubar i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.up { color: var(--critical); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 4px; font-weight: 500; }
.filters { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.filters input[type=search] { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; width: 220px; max-width: 100%; }
.filters label { display: inline-flex; gap: 5px; align-items: center; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.mini-top { table-layout: fixed; }
.mini-top td { padding: 4px 6px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-top th:first-child { width: auto; }
.mini-top th:nth-child(2) { width: 58px; }
.mini-top th:nth-child(3) { width: 74px; }
.mini-top th { overflow: hidden; text-overflow: ellipsis; }
.mini-top th { padding: 3px 6px; }

/* графики */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.ln { height: 3px; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 3; display: none; }
.tip .tt { color: var(--ink-2); margin-bottom: 3px; }
.tip .row { display: flex; gap: 8px; align-items: center; }

<script>
'use strict';

// ---------- форматирование ----------
const f1 = x => (x == null || isNaN(x)) ? '—' : (Math.abs(x) >= 100 ? Math.round(x).toString() : (+x).toFixed(1).replace('.', ','));

function mb(x) { if (x == null || isNaN(x)) return '—'; if (Math.abs(x) >= 1024) return (x / 1024).toFixed(1).replace('.', ',') + ' ГБ'; return f1(x) + ' МБ'; }

function bytesK(k) { const g = k / 1048576; if (g >= 1024) return (g / 1024).toFixed(1).replace('.', ',') + ' ТБ'; if (g >= 1) return g.toFixed(1).replace('.', ',') + ' ГБ'; return (k / 1024).toFixed(0) + ' МБ'; }
function bytes(b) {
  if (b == null || isNaN(b)) return '—'; const u = ['Б', 'КБ', 'МБ', 'ГБ', 'ТБ']; let i = 0; b = +b;
  while (b >= 1024 && i < 4) { b /= 1024; i++; }
  return (i ? (b >= 100 ? Math.round(b) : b.toFixed(1).replace('.', ',')) : Math.round(b)) + ' ' + u[i];
}
// ряды с разных роутеров — на общую шкалу времени (у каждого роутера свои отметки): пропуски заполняются предыдущим значением
function alignSeries(list) {
  const dts = []; list.forEach(s => { for (let i = 1; i < s.t.length; i++) dts.push(s.t[i] - s.t[i - 1]); });
  dts.sort((a, b) => a - b); const step = dts[Math.floor(dts.length / 2)] || 10;
  const keys = new Set(), maps = list.map(s => { const m = new Map(); s.t.forEach((t, i) => { const k = Math.round(t / step); m.set(k, s.v[i]); keys.add(k); }); return m; });
  const ks = [...keys].sort((a, b) => a - b);
  return { t: ks.map(k => k * step), vs: maps.map(m => { let p = 0; return ks.map(k => (m.has(k) ? (p = m.get(k)) : p)); }) };
}
function mbit(x) { if (x == null || isNaN(x)) return '—'; if (x < 1) return Math.round(x * 1000) + ' кбит/с'; return f1(x) + ' Мбит/с'; }
function dur(s) {

  return r.replace(/ /g, ' ');   // неразрывные пробелы: «5 ч 45 мин» не переносится по частям
}
const hhmm = t => { const d = new Date(t * 1000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const hhmmss = t => hhmm(t) + ':' + String(new Date(t * 1000).getSeconds()).padStart(2, '0');
const dt = t => new Date(t * 1000).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const last = a => (a && a.length) ? a[a.length - 1] : null;
// ---------- периоды графиков (в минутах): 15, 30, 45 минут, 1 час, затем +2 часа, 24 часа ----------
// 0 — «Всё»: вся имеющаяся история
const RANGES = [15, 30, 45, 60, 180, 300, 420, 540, 660, 780, 900, 1020, 1140, 1260, 1380, 1440, 0];
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const rangeLabel = m => m === 0 ? 'Всё' : m < 60 ? `${m} ${plural(m, 'минута', 'минуты', 'минут')}` : `${m / 60} ${plural(m / 60, 'час', 'часа', 'часов')}`;
const rangeFor = m => m === 0 ? 'всё время наблюдений' : m < 60 ? `${m} ${plural(m, 'минуту', 'минуты', 'минут')}` : rangeLabel(m);

// ---------- светофор: пороги жёлтого и красного (те же, что у значков состояния) ----------
const TH = { cpu: [70, 95], mem: [80, 95], swap: [60, 90], temp: [85, 95] };
const lvl = (v, th) => (v == null || isNaN(v)) ? 'none' : v >= th[1] ? 'bad' : v >= th[0] ? 'warn' : 'good';
const tlText = (v, th) => `color:var(--tl-${lvl(v, th)}-t)`;
// модули Wi-Fi для циферблата t° Wi-Fi: дуги (первая — внешняя) и строки подсказки
const wArcs = j => (j.wmods || []).map(w => ({ n: w.n, short: w.n.replace(/\s*ГГц$/, ''), v: w.t }));
const wTip = j => { const a = wArcs(j); return a.length > 1
  ? a.map((w, i) => `${i ? 'Внутренняя' : 'Внешняя'} шкала — ${w.n}: ${f1(w.v)} °C.`).join(' ')
  : a.length && a[0].n.includes('+') ? `Один датчик на весь радиочип (${a[0].n}): оба диапазона работают на одном чипе.` : ''; };
// циферблат в стиле Grafana: дуга 240°, снаружи тонкая шкала порогов, число в центре окрашено по светофору
function gauge(o) {
  // o.neutral — величина без «хорошо/плохо» (скорость канала): синяя дуга, обычный цвет цифры, шкала порогов серая
  const min = o.min || 0, max = o.max || 100, v = +o.value, l = o.neutral ? (isNaN(v) ? 'none' : 'neu') : lvl(v, o.th || [Infinity, Infinity]);
  if (!o.th) o.th = [max, max];
  const fr = x => Math.max(0, Math.min(1, ((+x) - min) / (max - min)));
  const A0 = 150, SW = 240, cx = 60, cy = 58;
  const pt = (a, r) => [(cx + r * Math.cos(a * Math.PI / 180)).toFixed(2), (cy + r * Math.sin(a * Math.PI / 180)).toFixed(2)];
  const arc = (f0, f1, r) => { if (f1 - f0 < 0.002) return ''; const a0 = A0 + SW * f0, a1 = A0 + SW * f1, [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r); return `M${x0},${y0}A${r},${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1},${y1}`; };

  // первая — внешняя; в центре — максимальная, внизу — подписи
  const multi = Array.isArray(o.arcs) && o.arcs.length > 1;
  const txt = o.text != null ? o.text : (isNaN(v) ? '—' : (o.fmt || f1)(v) + (o.unit ? ' ' + o.unit : ''));
  const m = String(txt).match(/^(\S+)\s(.+)$/), big = m ? m[1] : txt, unit = m ? m[2] : '';

  const tip = [o.title, o.sub, o.sub2].filter(Boolean).map(s => `<div>${esc(s)}</div>`).join('') + (o.goText ? `<div class="gt-go">Щёлкните по циферблату — ${esc(o.goText)}</div>` : '');

    <div class="gh"><span class="gl">${esc(o.label)}</span>${tip ? `<button type="button" class="qbtn" aria-label="Пояснение: ${esc(o.label)}">?</button><div class="gtip" role="tooltip">${tip}</div>` : ''}</div>
    <svg viewBox="0 0 120 92" role="img" aria-label="${esc(o.label)}: ${esc(txt)}">
      ${o.neutral ? `<path d="${arc(0, 1, 49)}" stroke="var(--axis)" stroke-width="3" fill="none"/>` : `

      <path d="${arc(t0, t1, 49)}" stroke="var(--tl-warn)" stroke-width="3" fill="none"/>

      ${multi ? o.arcs.map((a, i) => { const r = 43 - i * 9, al = lvl(a.v, o.th);

      <text x="60" y="90" text-anchor="middle" class="gm">${o.arcs.map(a => `${esc(a.short)}: ${esc(Math.round(a.v))}°`).join('  ')}</text>` : `
      <path d="${arc(0, 1, 40)}" stroke="var(--surface-2)" stroke-width="11" fill="none"/>
      <path d="${isNaN(v) ? '' : arc(0, fr(v), 40)}" stroke="var(--tl-${l})" stroke-width="11" fill="none"/>`}

    </svg>
  </div>`;
}
// подсказки «?» у циферблатов: наведение — показать, щелчок — закрепить; открытая подсказка переживает автообновление
let openGaugeKey = null;

// прокрутить к блоку (под шапку) и подсветить его. Если плавная прокрутка не пошла (вкладка в фоне,

let pendingGo = null;
const STATE = { R: 'выполняется', S: 'ожидает', D: 'ждёт диск', Z: 'зомби', T: 'остановлен', I: 'простаивает', t: 'трассировка', X: 'завершён' };

// ---------- API ----------
function get(url) {

    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

  else if (viaRelay.has(ip)) j = await get(`/cgi-bin/api?a=relay&ip=${ip}&q=${encodeURIComponent(q)}`);
  else {
    try { j = await get(`http://${ip}:${PORT}/cgi-bin/api?${q}`); }
    catch (e) { if (!e.net) throw e; viaRelay.add(ip); j = await get(`/cgi-bin/api?a=relay&ip=${ip}&q=${encodeURIComponent(q)}`); }
  }

}
let peersCache = null, manual = new Set(), hiddenList = [], lanInfo = { self: location.hostname, lan: '' };
async function peers(force) {
  if (peersCache && !force) return peersCache;
  try {
    const j = await api('', 'a=peers'); peersCache = j.peers.length ? j.peers : [location.hostname];
    manual = new Set(j.manual || []); hiddenList = j.hidden || []; lanInfo = { self: j.self, lan: j.lan || '' };

}
// POST на свой роутер (тело application/json — защита от запросов с чужих сайтов)
async function post(q, data) {
  const r = await fetch(`/cgi-bin/api?${q}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data), cache: 'no-store' });

}

// ---------- состояние роутера ----------
const ICON = {
  good: '<svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="var(--good)"/><path d="M3.3 6.2l1.8 1.8 3.6-3.8" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warning: '<svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M6 .6l5.6 10.2H.4z" fill="var(--warning)"/><path d="M6 4.3v3" stroke="#0b0b0b" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="9" r=".8" fill="#0b0b0b"/></svg>',
  serious: '<svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M6 .6l5.6 10.2H.4z" fill="var(--serious)"/><path d="M6 4.3v3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="9" r=".8" fill="#fff"/></svg>',

    $('#nettop-sub', this.m).textContent = `по ${PER} самых нагруженных с каждого роутера (по ${nm}); CPU за последние 10 с`;
    const cols = [{ k: 'router', label: 'Роутер' }, { k: 'name', label: 'Процесс' }, { k: 'pid', label: 'PID', n: 1, cls: 'hide-sm' }, { k: 'cpu', label: 'CPU', n: 1, title: '% всей мощности роутера за последние 10 с' }, { k: 'rss', label: 'Память (RSS)', n: 1 }, { k: 'thr', label: 'Потоки', n: 1, cls: 'hide-sm' }];
    const t = $('#nettop', this.m);
    const sorted = sortRows(rows, this.sort.k, this.sort.asc);
    t.innerHTML = thead(cols, this.sort) + sorted.map(p => `<tr class="click" data-h="${procHref(p.ip, p.pid, p.st)}"><td>${esc(p.router)}</td><td><span class="pname">${esc(p.name)}</span><span class="pcmd mono">${esc(p.cmd)}</span></td><td class="n hide-sm">${p.pid}</td><td class="n">${cpuCell(p.cpu)}</td><td class="n">${kb(p.rss)}</td><td class="n hide-sm">${p.thr}</td></tr>`).join('');
    t.querySelectorAll('tr[data-h]').forEach(tr => tr.onclick = () => location.hash = tr.dataset.h);
    bindSort(t, this.sort, () => this.renderTop());
  }
}

  // циферблаты: щелчок — к таблице процессов с подходящей сортировкой; «?» — подсказка (наведение или щелчок)
  bindGauges() {
    const box = $('#h-kpis', this.m);
    bindGaugeTips(box);
    box.querySelectorAll('.gauge[data-go]').forEach(g => {
      const go = () => this.goTo(JSON.parse(g.dataset.go));
      g.onclick = go; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
    // пришли с циферблата карточки на главной — сразу открыть таблицу процессов с нужной сортировкой
    if (pendingGo && pendingGo.ip === this.ip) { const g = pendingGo.go; pendingGo = null; setTimeout(() => this.goTo(g), 50); }
  }
  // куда ведёт щелчок по циферблату: { chart: id } — к графику, иначе — к таблице процессов с сортировкой
  goTo(go) {
    if (!go.chart) return this.goProcs(go);
    openGaugeKey = null; this.m.querySelectorAll('.gauge.open').forEach(x => x.classList.remove('open'));
    scrollToPanel($('#' + go.chart, this.m).closest('.panel'));
  }
  goProcs(go) {
    this.sort = { k: go.sort, asc: false }; lsSet('rmon.psort', this.sort);
    Object.assign(this.f, { q: go.q || '', kern: !!go.kern, gone: false, group: false });
    $('#pq', this.m).value = this.f.q; $('#fg', this.m).checked = false; $('#fk', this.m).checked = this.f.kern; $('#fz', this.m).checked = false;
    openGaugeKey = null; this.m.querySelectorAll('.gauge.open').forEach(x => x.classList.remove('open'));
    this.setProcsOpen(true);   // щелчок по циферблату ведёт к таблице — она должна быть развёрнута
    this.renderProcs();
    scrollToPanel($('#p-panel', this.m));
  }
  ifStats() {
    const N = this.j.net || {}, out = [];
    for (const [nm, s] of Object.entries(N)) {
      const a = s.rx.reduce((x, y) => x + y, 0) / (s.rx.length || 1), b = s.tx.reduce((x, y) => x + y, 0) / (s.tx.length || 1);
      out.push({ name: nm, rx: last(s.rx), tx: last(s.tx), arx: a, atx: b, prx: Math.max(0, ...s.rx), ptx: Math.max(0, ...s.tx), sum: a + b });
    }
    return out.sort((x, y) => y.sum - x.sum);
  }
  renderIfs() {
    const st = this.ifStats();
    if (!this.iface || !this.j.net[this.iface]) this.iface = (this.j.net[this.j.wan] ? this.j.wan : st[0] && st[0].name);
    const sel = $('#ifsel', this.m);
    sel.innerHTML = st.map(s => `<option value="${esc(s.name)}"${s.name === this.iface ? ' selected' : ''}>${esc(s.name)}${s.name === this.j.wan ? ' (WAN)' : ''}</option>`).join('');
    const t = $('#ifs', this.m);
    t.innerHTML = `<tr><th>Интерфейс</th><th class="n">↓ сейчас</th><th class="n">↑ сейчас</th><th class="n hide-sm">↓ средн.</th><th class="n hide-sm">↑ средн.</th><th class="n">↓ пик</th></tr>` +
      st.filter(s => s.sum > 0.0005 || s.name === this.iface).map(s => `<tr class="click${s.name === this.iface ? '" style="background:var(--sel)' : ''}" data-if="${esc(s.name)}"><td class="mono">${esc(s.name)}${s.name === this.j.wan ? '<span class="tag">WAN</span>' : ''}</td><td class="n">${mbit(s.rx)}</td><td class="n">${mbit(s.tx)}</td><td class="n hide-sm">${mbit(s.arx)}</td><td class="n hide-sm">${mbit(s.atx)}</td><td class="n">${mbit(s.prx)}</td></tr>`).join('');
    t.querySelectorAll('tr[data-if]').forEach(tr => tr.onclick = () => { this.iface = tr.dataset.if; this.renderIfs(); this.renderNet(); });
  }
  renderNet() {
    const s = this.j.net[this.iface];
    if (!s) { this.ch.net.set([], []); return; }
    this.ch.net.set(s.t, [{ name: '↓ приём', color: 'var(--s1)', v: s.rx }, { name: '↑ передача', color: 'var(--s2)', v: s.tx }]);
  }
  renderProcs() {
    const all = this.j.procs || [], f = this.f;
    let rows = all.filter(p => (f.kern || !p.k) && (f.gone || !p.gone));
    // поиск: несколько вариантов через «|» — подходит любой
    const terms = (f.q || '').toLowerCase().split('|').map(s => s.trim()).filter(Boolean);
    if (terms.length) rows = rows.filter(p => terms.some(q => p.name.toLowerCase().includes(q) || (p.cmd || '').toLowerCase().includes(q) || String(p.pid) === q));
    const sw = this.j.swap || {};
    rows.forEach(p => { p.drss = p.rss - p.rss0; p.swap = p.gone ? 0 : (sw[p.pid] || 0); });
    const live = all.filter(p => !p.gone);

    const cols = [{ k: 'name', label: 'Процесс' }, { k: 'pid', label: 'PID', n: 1 }, { k: 'cpu', label: 'CPU 10 с', n: 1, title: 'за последние 10 секунд' }, { k: 'avg', label: 'CPU средн.', n: 1, title: 'среднее за последний час (или время жизни процесса)' }, { k: 'peak', label: 'CPU пик', n: 1, title: 'максимум за 10 с в течение часа', cls: 'hide-sm' },

      <td class="n">${p.pid}</td><td class="n">${cpuCell(p.cpu)}</td><td class="n">${pct(p.avg)}</td><td class="n hide-sm">${pct(p.peak)}</td><td class="n">${kb(p.rss)}</td>
      <td class="n hide-sm ${p.drss > 1024 && p.drss > p.rss0 * 0.1 ? 'up' : ''}">${p.drss ? (p.drss > 0 ? '+' : '−') + kb(Math.abs(p.drss)) : '—'}</td><td class="n hide-sm">${p.swap ? kb(p.swap) : '—'}</td><td class="n hide-sm">${p.thr}</td><td class="hide-sm" title="${esc(STATE[p.state] || '')}">${esc(p.state)}</td></tr>`;

      const g = new Map(); for (const p of rows) { if (!g.has(p.name)) g.set(p.name, []); g.get(p.name).push(p); }
      const groups = [...g.entries()].map(([name, ps]) => ({ name, ps, pid: ps.length, cpu: ps.reduce((a, p) => a + p.cpu, 0), avg: ps.reduce((a, p) => a + p.avg, 0), peak: Math.max(...ps.map(p => p.peak)), rss: ps.reduce((a, p) => a + p.rss, 0), drss: ps.reduce((a, p) => a + p.drss, 0), swap: ps.reduce((a, p) => a + p.swap, 0), thr: ps.reduce((a, p) => a + p.thr, 0), state: '' }));
      for (const G of sortRows(groups, this.sort.k, this.sort.asc)) {

        if (o) for (const p of sortRows(G.ps, this.sort.k, this.sort.asc)) body += prow(p, true);

    t.innerHTML = thead(cols, this.sort) + (body || `<tr><td colspan="10" class="empty">Ничего не найдено</td></tr>`);

    const mx = Math.max(1, ...rows.map(r => Math.max(r.brx, r.btx)));
    const link = r => r.st === 'up' ? (r.sp ? (r.sp >= 1000 ? `${f1(r.sp / 1000)} Гбит/с` : `${r.sp} Мбит/с`) : 'работает') : r.st === 'unknown' ? 'работает' : r.st === 'lowerlayerdown' ? 'нет кабеля' : r.st === 'down' ? 'выключен' : r.st || '—';
    const vb = (v, c) => `<span class="vol"><i style="width:${(v / mx * 100).toFixed(1)}%;background:${c}"></i></span>${bytes(v)}`;
    const t = $('#t-tab', this.m);
    t.innerHTML = thead(cols, this.sort) + (sortRows(rows, this.sort.k, this.sort.asc).map(r => {
      const c = this.col[r.name], on = c != null;
      return `<tr class="click" data-if="${esc(r.name)}"${on ? ' style="background:var(--sel)"' : ''}><td class="ck"><input type="checkbox" ${on ? 'checked' : ''} ${!r.has ? 'disabled' : ''} aria-label="Показать ${esc(r.name)} на графиках"></td>
        <td class="mono" style="white-space:nowrap">${on ? `<span class="sw" style="background:${SER[c]}"></span>` : ''}${esc(r.name)}${r.name === j.wan ? '<span class="tag">WAN</span>' : ''}</td>
        <td class="hide-sm"><span class="role">${esc(r.role)}${r.m ? `${r.role ? ' · ' : ''}в мосту ${esc(r.m)}` : ''}</span></td>
        <td class="hide-sm role">${esc(link(r))}</td><td class="n">${r.sta != null ? r.sta : '—'}</td>
        <td class="n">${mbit(r.rx)}</td><td class="n">${mbit(r.tx)}</td><td class="n hide-sm">${mbit(r.arx)}</td><td class="n hide-sm">${mbit(r.atx)}</td><td class="n hide-sm">${mbit(r.prx)}</td><td class="n hide-sm">${mbit(r.ptx)}</td>
        <td class="n">${vb(r.brx, 'var(--s1)')}</td><td class="n">${vb(r.btx, 'var(--s2)')}</td></tr>`;
    }).join('') || `<tr><td colspan="13" class="empty">Данные ещё собираются…</td></tr>`);
    t.querySelector('th').classList.remove('sort');
    t.querySelectorAll('tr[data-if]').forEach(tr => tr.onclick = e => {
      const n = tr.dataset.if; if (!(this.j.net || {})[n]) return;
      if (n in this.col) delete this.col[n];
      else { const used = new Set(Object.values(this.col)); const free = SER.findIndex((_, i) => !used.has(i)); if (free < 0) { e.preventDefault(); return; } this.col[n] = free; }
      lsSet('rmon.tsel.' + this.ip, this.col); this.renderCharts(); this.renderTab();
    });
    bindSort(t, this.sort, () => { lsSet('rmon.tsort', this.sort); this.renderTab(); });
  }
}

// ================= Роутер · Клиенты =================
// клиенты этого роутера сейчас: Wi-Fi-станции его точек доступа (сигнал, скорость канала, время в сети) и
// проводные устройства на его портах; объём обмена с интернетом — за выбранный период
class ClientsView {
  constructor(m, r) {
    this.m = m; this.ip = r.ip;
    this.range = +lsGet('rmon.rangeMin', 60); if (!RANGES.includes(this.range)) this.range = 60;
    this.sort = lsGet('rmon.csort', { k: 'sig', asc: false });
    crumbs([{ label: r.ip, href: hostHref(r.ip) }, { label: 'Клиенты' }]);
    setHelp('<div><b>Клиенты роутера</b></div><div>Устройства, подключённые к этому роутеру прямо сейчас: по Wi-Fi (к его точкам доступа) и по проводу (к его LAN-портам). Хостнейм — из статических хостов /etc/config/dhcp, у незнакомого устройства пусто.</div><div>Сигнал: зелёный — от −60 дБм, жёлтый — до −70, красный — слабее. Скорость канала — согласованная скорость Wi-Fi (↓ к устройству, ↑ от него), а не фактический трафик. Получено и отправлено — обмен с интернетом за период.</div>');
    m.innerHTML = `<div class="panel-h" style="margin-bottom:var(--gap)"><div class="hline"><h1 id="c-name">${esc(r.ip)}</h1><span class="sub" id="c-sub"></span></div></div>
      ${hostTabs(r.ip, 'c')}
      <div class="panel" style="margin-bottom:var(--gap)"><div class="kpis even" id="c-kpis"></div></div>
      <div style="margin-bottom:var(--gap)"><label class="ink2" style="font-size:13px;display:inline-flex;gap:6px;align-items:center">Период (для объёма)
          <select id="c-range" class="btn">${RANGES.map(h => `<option value="${h}"${h === this.range ? ' selected' : ''}>${rangeLabel(h)}</option>`).join('')}</select></label></div>
      <div class="panel"><div class="panel-h"><h2>Клиенты</h2><span class="muted" style="font-size:12px" id="c-cnt"></span></div>
        <div class="tbl-wrap"><table id="c-tab"></table></div></div>`;
    $('#c-range', m).onchange = e => { this.range = +e.target.value; lsSet('rmon.rangeMin', this.range); tick(); };
  }
  async refresh() {
    const seq = this.seq = (this.seq || 0) + 1, range = this.range;
    const T = await loadTop(range, this.ip);
    if (seq !== this.seq || range !== this.range) return;
    if (!T.cl) throw new Error('роутер не отдал список клиентов');
    this.T = T; const cl = T.cl;
    crumbs([{ label: cl.name || this.ip, href: hostHref(this.ip) }, { label: 'Клиенты' }]); document.title = `Клиенты · ${cl.name} · Мониторинг роутера`;
    $('#c-name', this.m).textContent = (cl.name || this.ip) + ':';
    $('#c-sub', this.m).textContent = `${this.ip} · клиенты сейчас · объём за ${rangeFor(this.range)}`;
    // MAC → IP-адреса и имя (по таблице устройств шлюза: ARP + статические хосты)
    const byMac = {};
    // (без служебных адресов 169.254.x.x)
    for (const [ip, d] of Object.entries(T.devs)) if (d.m && !ip.startsWith('169.254.')) { const o = byMac[d.m] || (byMac[d.m] = { ips: [], n: '' }); o.ips.push(ip); if (d.n && !o.n) o.n = d.n; }
    // объём за период по каждому IP — из топа адресов
    const vol = {}; for (const r of T.rows) for (const [c, v] of Object.entries(r.c)) { const p = vol[c] || (vol[c] = [0, 0]); p[0] += v[0]; p[1] += v[1]; }
    const sortIp = a => a.slice().sort((x, y) => x.split('.').map(Number).reduce((s, n, i) => s || n - y.split('.').map(Number)[i], 0));
    const row = (mac, how, x) => {
      const d = byMac[mac] || { ips: [], n: '' }, ips = sortIp(d.ips);
      const u = ips.reduce((a, ip) => a + ((vol[ip] || [0])[0]), 0), g = ips.reduce((a, ip) => a + ((vol[ip] || [0, 0])[1]), 0);
      return { n: d.n, ip: ips.join(', '), ipk: ips[0] || '', m: mac, how, u, d: g, ...x };
    };
    const rows = [], aps = cl.aps || {};
    for (const s of cl.sta || []) {
      const a = aps[s.if] || {};
      rows.push(row(s.m, `Wi-Fi ${band(a.f)}${a.ssid ? ' · ' + a.ssid : ''}`, { wifi: 1, b: band(a.f), sig: s.sig, tx: s.tx, rx: s.rx, ct: s.ct, inact: s.in / 1000, ifn: s.if }));
    }
    const rmac = new Set(Object.keys(T.rnames).map(r => r === this.ip ? '' : ((T.devs[r] || {}).m || '')).filter(Boolean));
    for (const [port, ms] of Object.entries(cl.wired || {})) {
      if (ms.some(x => rmac.has(x))) continue;   // за портом другой роутер — магистраль
      for (const x of ms) rows.push(row(x, `провод · ${port}`, { wifi: 0, sig: null, tx: null, rx: null, ct: null, inact: null, ifn: port }));
    }
    this.rows = rows; this.renderKpis(); this.renderTab();
  }
  renderKpis() {
    const R = this.rows, w = R.filter(r => r.wifi), sig = w.map(r => r.sig).filter(x => x < 0);
    const k = (l, v, s = '') => `<div class="kpi"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;
    const weak = w.filter(r => r.sig < -70).length;
    $('#c-kpis', this.m).innerHTML =
      k('Всего клиентов', R.length, 'подключено сейчас') +
      k('Wi-Fi 2,4 ГГц', w.filter(r => r.b === '2,4 ГГц').length, 'дальше, медленнее') +
      k('Wi-Fi 5 ГГц', w.filter(r => r.b === '5 ГГц').length, 'быстрее, ближе') +
      (w.some(r => r.b === '6 ГГц') ? k('Wi-Fi 6 ГГц', w.filter(r => r.b === '6 ГГц').length) : '') +
      k('По проводу', R.length - w.length, 'LAN-порты роутера') +
      k('Средний сигнал', sig.length ? `${Math.round(sig.reduce((a, b) => a + b, 0) / sig.length)}<small>дБм</small>` : '—', 'по Wi-Fi-клиентам') +
      k('Слабый сигнал', `<span class="${weak ? 'sig-bad' : ''}">${weak}</span>`, 'хуже −70 дБм') +
      k('Получено', bytes(R.reduce((a, r) => a + r.d, 0)).replace(/ (\S+)$/, '<small>$1</small>'), `за ${rangeFor(this.range)}`) +
      k('Отправлено', bytes(R.reduce((a, r) => a + r.u, 0)).replace(/ (\S+)$/, '<small>$1</small>'), `за ${rangeFor(this.range)}`);
  }
  renderTab() {
    const cols = [{ k: 'n', label: 'Хостнейм' }, { k: 'ipk', label: 'IP' }, { k: 'm', label: 'MAC', cls: 'hide-sm' }, { k: 'how', label: 'Подключение' },
      { k: 'sig', label: 'Сигнал', n: 1, title: 'уровень сигнала Wi-Fi, дБм (ближе к 0 — лучше)' }, { k: 'tx', label: 'Канал ↓', n: 1, title: 'скорость канала к устройству, Мбит/с', cls: 'hide-sm' }, { k: 'rx', label: 'Канал ↑', n: 1, title: 'скорость канала от устройства, Мбит/с', cls: 'hide-sm' },
      { k: 'ct', label: 'В сети', n: 1, title: 'сколько подключено к этой точке доступа' }, { k: 'inact', label: 'Простой', n: 1, title: 'сколько не передавало данных', cls: 'hide-sm' },
      { k: 'd', label: '↓ Получено', n: 1, title: 'из интернета за период' }, { k: 'u', label: '↑ Отправлено', n: 1, title: 'в интернет за период' }];
    const sc = s => s == null ? '' : s >= -60 ? 'sig-good' : s >= -70 ? 'sig-warn' : 'sig-bad';
    const ag = s => s == null ? '—' : s < 60 ? `${Math.round(s)} с` : dur(s);
    const t = $('#c-tab', this.m);
    $('#c-cnt', this.m).textContent = `${this.rows.length} ${plural(this.rows.length, 'устройство', 'устройства', 'устройств')} · щелчок по заголовку — сортировка`;
    t.innerHTML = thead(cols, this.sort) + (sortRows(this.rows, this.sort.k, this.sort.asc).map(r => `<tr>
      <td><span class="pname">${esc(r.n)}</span></td><td class="mono" style="white-space:nowrap">${esc(r.ip)}</td><td class="mono hide-sm muted" style="white-space:nowrap">${esc(r.m)}</td>
      <td class="role" title="${esc(r.ifn)}">${esc(r.how)}</td>
      <td class="n ${sc(r.sig)}">${r.sig == null ? '—' : r.sig + ' дБм'}</td><td class="n hide-sm">${r.tx == null ? '—' : f1(r.tx)}</td><td class="n hide-sm">${r.rx == null ? '—' : f1(r.rx)}</td>
      <td class="n">${ag(r.ct)}</td><td class="n hide-sm">${ag(r.inact)}</td><td class="n">${bytes(r.d)}</td><td class="n">${bytes(r.u)}</td></tr>`).join('')
      || `<tr><td colspan="11" class="empty">К этому роутеру сейчас никто не подключён</td></tr>`);
    bindSort(t, this.sort, () => { lsSet('rmon.csort', this.sort); this.renderTab(); });
  }
}

// ================= Процесс =================
class ProcView {
  constructor(m, r) {
    this.m = m; this.ip = r.ip; this.pid = r.pid; this.st = r.st; this.tsort = { k: 'cpu', asc: false };
    crumbs([{ label: r.ip, href: hostHref(r.ip) }, { label: 'PID ' + r.pid }]);
    setHelp('<div><b>Процесс</b></div><div>CPU и память процесса за последний час, его потоки (загрузка замеряется за 1 с), открытые порты и соединения. CPU — в % всей мощности роутера.</div>');
    m.innerHTML = `<div id="p-banner"></div>
      <div class="panel-h" style="margin-bottom:var(--gap)"><div style="min-width:0"><h1 id="p-name">PID ${esc(r.pid)}</h1><div class="sub" id="p-sub"></div></div></div>
      <div class="panel" style="margin-bottom:var(--gap)" id="p-kpip"><div class="kpis" id="p-kpis"></div></div>
      <div class="grid g-eq" id="p-charts">
        <div class="panel"><div class="panel-h"><h2>CPU за час, %</h2><span class="muted" style="font-size:12px">% всей мощности роутера</span></div><div id="pc-cpu"></div></div>
        <div class="panel"><div class="panel-h"><h2>Память (RSS) за час, МБ</h2></div><div id="pc-rss"></div></div>
      </div>
      <div class="grid g-eq section" id="p-sec1">
        <div class="panel"><div class="panel-h"><h2>Сведения</h2></div><dl class="kv" id="p-kv"></dl></div>
        <div class="panel"><div class="panel-h"><h2>Память процесса</h2></div><dl class="kv" id="p-mem"></dl></div>
      </div>
      <div class="grid g-eq section" id="p-sec2">
        <div class="panel"><div class="panel-h"><h2>Потоки</h2><span class="muted" style="font-size:12px">CPU за 1 с замера</span></div><div class="tbl-wrap"><table id="p-thr"></table></div></div>
        <div class="panel"><div class="panel-h"><h2>Сеть и связи</h2></div><div id="p-net"></div></div>
      </div>`;
    this.ch = { cpu: new Chart($('#pc-cpu', m), { tipFmt: pct }), rss: new Chart($('#pc-rss', m), { fmt: v => v >= 10 ? Math.round(v) + '' : (+v).toFixed(1).replace('.', ','), tipFmt: mb }) };
  }
  async refresh() {
    const j = await api(this.ip, `a=proc&pid=${encodeURIComponent(this.pid)}&st=${encodeURIComponent(this.st)}`); this.j = j;
    const H = j.hist, nm = (j.status && j.status.Name) || H.name || 'PID ' + j.pid;
    crumbs([{ label: j.name || this.ip, href: hostHref(this.ip) }, { label: `${nm} (${j.pid})` }]);
    document.title = `${nm} · ${j.name} · Мониторинг роутера`;
    $('#p-name', this.m).textContent = nm;
    // завершившийся процесс: показываем только то, что о нём известно, без пустых блоков и прочерков
    const hasH = H.t.length > 0, show = (id, on) => { $(id, this.m).style.display = on ? '' : 'none'; };
    show('#p-kpip', j.alive || hasH); show('#p-charts', j.alive || H.t.length > 1);
    show('#p-sec1', j.alive); show('#p-sec2', j.alive);
    const back = `<a href="${hostHref(this.ip)}">К процессам роутера</a>`;
    $('#p-banner', this.m).innerHTML = j.alive ? '' : `<div class="banner">${ICON.serious}<span>${hasH
      ? `Процесс завершился. Ниже — его нагрузка за последний час, пока он работал (виден последний раз в ${hhmm(last(H.t))}). ${back}`
      : `Процесс завершился, и данных о нём за последний час нет: он работал меньше 10 секунд или закончился больше часа назад. ${back}`}</span></div>`;
    if (!j.alive) {
      if (hasH) this.stop = true;   // данные завершившегося процесса больше не изменятся — автообновление не нужно
      $('#p-sub', this.m).textContent = `PID ${j.pid} · ${j.name} · завершён`;
      if (!hasH) return;
    }
    const cpu = H.cpu, rssMB = H.rss.map(x => x / 1024);
    const avg = cpu.length ? cpu.reduce((a, b) => a + b, 0) / cpu.length : null;
    const st = j.status || {};
    const rssNow = j.alive ? parseInt(st.VmRSS) : last(H.rss);
    $('#p-sub', this.m).innerHTML = j.alive
      ? `PID ${j.pid} · ${esc(j.name)} · пользователь <b>${esc(j.user || j.uid)}</b> · ${esc(STATE[(st.State || '')[0]] || st.State || '')} · запущен ${esc(dt(j.started))} (${dur(j.now - j.started)} назад)`
      : `PID ${j.pid} · ${esc(j.name)} · завершён`;
    const k = (l, v, s = '') => `<div class="kpi"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;
    const u = s => { const m = String(s).match(/^(\S+)\s(.*)$/); return m ? `${m[1]}<small>${m[2]}</small>` : s; };
    const drss = H.rss.length ? last(H.rss) - H.rss[0] : 0;
    const span = (last(H.t) || 0) - (H.t[0] || 0);
    if (!j.alive) {
      $('#p-kpis', this.m).innerHTML =
        k('CPU средн.', u(pct(avg).replace('%', ' %')), 'пока работал') +
        k('CPU пик', u(pct(Math.max(...cpu)).replace('%', ' %')), 'максимум за 10 с') +
        k('Память (RSS)', u(kb(last(H.rss))), 'перед завершением') +
        k('Наблюдался', esc(span > 0 ? dur(span + 10) : '≈ 10 с'), `до ${hhmmss(last(H.t))}`);
    } else $('#p-kpis', this.m).innerHTML =
      k('CPU 10 с', u(pct(last(cpu)).replace('%', ' %')), `пик за час ${pct(cpu.length ? Math.max(...cpu) : null)}`) +
      k('CPU средн.', u(pct(avg).replace('%', ' %')), span > 0 ? `за ${dur(span)} наблюдений` : 'данные копятся') +
      k('Память (RSS)', u(kb(rssNow)), drss ? `за час ${drss > 0 ? '+' : '−'}${kb(Math.abs(drss))}` : 'за час без изменений') +
      (j.alive ? k('В swap', u(kb(parseInt(st.VmSwap) || 0)), 'VmSwap') + k('Потоки', st.Threads || '—', '') + k('Файлы', j.fds, 'открытых дескрипторов') +
        k('Соединения', j.conns, `слушает портов: ${j.sockets.length}`) + k('OOM score', j.oom, 'кого ядро убьёт первым при нехватке памяти') : '');
    this.ch.cpu.set(H.t, [{ name: 'CPU', color: 'var(--s1)', v: cpu }]);
    this.ch.rss.set(H.t, [{ name: 'RSS', color: 'var(--s2)', v: rssMB }]);
    // сведения
    const ppid = j.alive ? st.PPid : H.ppid;
    const kids = (j.children || []).map(c => `<a class="chip" href="${procHref(this.ip, c.pid, c.st)}">${esc(c.name)} ${c.pid}</a>`).join('');
    $('#p-kv', this.m).innerHTML = j.alive ? `
      <dt>Команда</dt><dd class="mono">${esc(j.cmd || '[поток ядра]')}</dd>
      <dt>Файл</dt><dd class="mono">${esc(j.exe || '—')}</dd>
      <dt>Рабочая папка</dt><dd class="mono">${esc(j.cwd || '—')}</dd>
      <dt>Родитель</dt><dd>${+ppid > 0 ? `<a href="${procHref(this.ip, ppid, '')}">PID ${esc(ppid)}</a>` : '—'}</dd>
      <dt>Дочерние</dt><dd>${kids ? `<div class="chips">${kids}</div>` : 'нет'}</dd>
      <dt>Переключения</dt><dd class="num">${esc(st.voluntary_ctxt_switches)} добровольных, ${esc(st.nonvoluntary_ctxt_switches)} вытеснений</dd>` :
      `<dt>Родитель</dt><dd>${+ppid > 0 ? `<a href="${procHref(this.ip, ppid, '')}">PID ${esc(ppid)}</a>` : '—'}</dd>`;
    const memRows = [['VmRSS', 'Физическая память (RSS)'], ['RssAnon', '— своя (heap, стек)'], ['RssFile', '— файлы и библиотеки'], ['RssShmem', '— общая'], ['VmSwap', 'Вытеснено в swap'], ['VmPeak', 'Пик виртуальной'], ['VmSize', 'Виртуальная'], ['VmData', 'Данные'], ['VmLib', 'Библиотеки']];
    $('#p-mem', this.m).innerHTML = j.alive ? memRows.filter(([key]) => st[key]).map(([key, l]) => `<dt>${l}</dt><dd class="num">${esc(kb(parseInt(st[key])))}</dd>`).join('') : '<dd class="muted">процесс завершён</dd>';
    // потоки
    const th = (j.threads || []).map(x => ({ ...x }));
    const t = $('#p-thr', this.m);
    if (!th.length) t.innerHTML = `<tr><td class="empty">${j.alive ? 'Нет данных' : 'Процесс завершён'}</td></tr>`;
    else {
      const render = () => {
        t.innerHTML = thead([{ k: 'name', label: 'Поток' }, { k: 'tid', label: 'TID', n: 1 }, { k: 'cpu', label: 'CPU', n: 1 }, { k: 'ticks', label: 'CPU всего', n: 1, title: 'процессорное время с запуска' }, { k: 'state', label: 'Сост.' }], this.tsort) +
          sortRows(th, this.tsort.k, this.tsort.asc).map(x => `<tr><td>${esc(x.name)}</td><td class="n">${x.tid}</td><td class="n">${cpuCell(x.cpu)}</td><td class="n">${dur(x.ticks / 100)}</td><td title="${esc(STATE[x.state] || '')}">${esc(x.state)}</td></tr>`).join('');
        bindSort(t, this.tsort, render);
      };
      render();
    }
    $('#p-net', this.m).innerHTML = !j.alive ? '<div class="empty">Процесс завершён</div>' :
      `<dl class="kv"><dt>Установленных TCP</dt><dd class="num">${j.conns}</dd><dt>Слушает</dt><dd>${j.sockets.length ? `<div class="chips">${j.sockets.map(s => `<span class="chip mono">${esc(s.proto)} ${esc(s.addr)}</span>`).join('')}</div>` : 'ничего'}</dd></dl>`;
  }
}

// ================= Мастер «Добавить роутер» =================
function addRouterWizard(onDone, ip0) {
  const dlg = document.createElement('dialog'); dlg.className = 'modal'; document.body.appendChild(dlg);
  const S = { step: 'ip', ip: ip0 || '', c: null, err: '', busy: false, pw: '', ok: {}, persist: false, res: null };
  let changed = false;
  const close = () => { dlg.close(); dlg.remove(); if (changed) onDone(); };
  dlg.addEventListener('cancel', e => { if (S.busy) e.preventDefault(); else { e.preventDefault(); close(); } });
  const msg = (lvl, html) => `<div class="msg">${ICON[lvl]}<div>${html}</div></div>`;
  const yes = (v, a, b) => v ? `${ICON.good}<span>${a}</span>` : `${ICON.critical}<span>${b}</span>`;

  function body() {
    const c = S.c, ip = esc(S.ip);
    let h = `<div><label for="w-ip" style="font-size:13px;color:var(--ink-2)">IP-адрес роутера в локальной сети${lanInfo.lan ? ` (${esc(lanInfo.lan)})` : ''}</label>
      <div class="row2" style="margin-top:4px"><input type="text" id="w-ip" inputmode="decimal" placeholder="например ${esc(ipExample())}" value="${ip}" ${S.step !== 'ip' && S.step !== 'checked' ? 'disabled' : ''}><button class="btn" id="w-check" ${S.busy || S.step === 'done' ? 'disabled' : ''}>Проверить</button></div></div>`;
    if (S.err) h += msg('critical', esc(S.err));
    if (!c) return h + `<p class="muted" style="margin:0;font-size:13px">Сначала проверю, отвечает ли роутер, есть ли на нём SSH и не стоит ли уже RouterMon. Проверка ничего не меняет.</p>`;

    const hostN = `<b>${esc(c.host)}</b> (${esc(c.hostip)})`;
    h += `<div class="checks">${yes(c.ping || c.ssh, 'отвечает в сети', 'не отвечает на ping')}${yes(c.ssh, 'SSH работает' + (c.banner ? ` <span class="muted mono">${esc(c.banner)}</span>` : ''), 'SSH (порт 22) не отвечает')}
      ${c.rmon ? `${ICON.good}<span>RouterMon уже установлен</span>` : `${ICON.warning}<span>RouterMon не установлен</span>`}
      ${c.key ? `${ICON.good}<span>${esc(c.host)} уже может войти по ключу — пароль не нужен</span>` : ''}</div>`;
    if (S.step === 'done') {
      const r = S.res;
      h += r.result === 'installed' ? msg('good', `RouterMon установлен на ${ip} и роутер добавлен в список. Через 20–30 секунд появятся первые графики.`) : msg('good', `${ip} добавлен в список роутеров.`);
      if (r.log) h += `<details><summary class="muted" style="font-size:12px;cursor:pointer">Журнал установки</summary><div class="msg"><pre>${esc(r.log)}</pre></div></details>`;
      return h;
    }
    if (c.rmon) {
      return h + `<div class="access"><h3>Добавить в список</h3>
        <p><b>Что:</b> адрес ${ip} будет записан в список роутеров на ${hostN} (файл /etc/rmon-web/routers.conf). Так ${ip} будет виден на главной, даже если его нет в ARP-таблице.</p>
        <p><b>Доступы:</b> не нужны — на ${ip} ничего не меняется.</p></div>`;
    }
    if (!c.ssh) {
      return h + msg('critical', `На ${ip} не отвечает SSH. Поставить RouterMon можно только на роутер с OpenWrt, где включён SSH (в LuCI: Система → Администрирование → SSH-доступ). Если это роутер с другой прошивкой, RouterMon на него не встанет.`);
    }
    const lan = esc(c.lan || lanInfo.lan || 'локальной сети');
    h += `<p style="margin:0;font-size:13px">Чтобы показывать нагрузку ${ip}, на нём нужно поставить RouterMon. Установку выполнит роутер ${hostN}. Прочитайте, какие доступы для этого нужны, и отметьте согласие.</p>`;
    h += `<div class="access"><h3>1. Однократный вход на ${ip} под root по SSH</h3>
      <p><b>Что:</b> ${hostN} один раз подключится к ${ip} по SSH под учётной записью root ${c.key ? 'по уже настроенному ключу' : 'с паролем, который вы введёте ниже'}.</p>
      <p><b>Зачем:</b> скопировать файлы RouterMon и включить его службу. На OpenWrt это можно сделать только с правами root.</p>
      <div class="risk"><p><b>Риски:</b></p><ul>
        ${c.key ? '' : `<li>Пароль идёт от браузера к ${esc(c.host)} по обычному HTTP, без шифрования. Его может перехватить тот, кто прослушивает вашу локальную сеть. Вводите пароль только в доверенной домашней сети; если сомневаетесь, смените пароль root на ${ip} после установки.</li>
        <li>Пароль нигде не сохраняется: он нужен только на время установки и сразу забывается.</li>`}
        <li>При первом подключении ${esc(c.host)} запоминает ключ SSH-сервера ${ip} без проверки. Если в сети кто-то подменяет адреса, соединение может уйти к нему.</li>
        <li>У root полные права на роутере. Установщик меняет только то, что перечислено в пункте 2, и сначала проверяет, что это OpenWrt с веб-сервером uhttpd и что хватает места.</li></ul></div>
      ${c.key ? '' : `<input type="password" id="w-pw" placeholder="пароль root на ${ip}" autocomplete="off" value="${esc(S.pw)}">`}
      <label class="ok"><input type="checkbox" data-ok="ssh" ${S.ok.ssh ? 'checked' : ''}> Понимаю и разрешаю вход на ${ip} под root</label></div>`;
    h += `<div class="access"><h3>2. Что изменится на ${ip}</h3><ul>
        <li>Появятся папка <span class="mono">/etc/rmon-web</span> (около 150 КБ флеш-памяти) и служба <span class="mono">/etc/init.d/rmon</span>. Оба пути добавляются в <span class="mono">/etc/sysupgrade.conf</span>, чтобы пережить обновление прошивки.</li>
        <li>В настройки uhttpd добавится отдельный веб-сервер на порту 8089. Веб-интерфейс LuCI при этом перезапустится и на 2–3 секунды станет недоступен.</li>
        <li>Служба раз в 10 секунд читает данные о системе и процессах: около 1% CPU и до 4 МБ оперативной памяти.</li>
        <li>В список роутеров на ${ip} будет записан ${esc(c.hostip)}, чтобы роутеры видели друг друга.</li></ul>
      <div class="risk"><p><b>Риски:</b></p><ul>
        <li>Страница RouterMon открывается без пароля. Любое устройство в сети ${lan} сможет видеть нагрузку ${ip}, список его процессов и их командные строки. Если какая-то программа получает пароль или токен прямо в командной строке, его тоже будет видно.</li>
        <li>Порт 8089 открыт только для локальной сети. API умеет лишь читать данные: остановить процесс или изменить настройки через него нельзя.</li></ul></div>
      <p>Убрать всё: <span class="mono">install.ps1 -Hosts ${ip} -Uninstall</span> с ПК или <span class="mono">sh /etc/rmon-web/lib/setup.sh remove</span> на самом роутере.</p>
      <label class="ok"><input type="checkbox" data-ok="chg" ${S.ok.chg ? 'checked' : ''}> Согласен на эти изменения</label></div>`;
    if (!c.key) h += `<div class="access"><h3>3. Постоянный доступ ${esc(c.host)} → ${ip} по ключу <span class="opt">необязательно</span></h3>
      <p><b>Что:</b> открытый ключ роутера ${hostN} будет добавлен в <span class="mono">/etc/dropbear/authorized_keys</span> на ${ip}.</p>
      <p><b>Зачем:</b> чтобы потом переустанавливать или обновлять RouterMon на ${ip} отсюда без пароля.</p>
      <div class="risk"><p><b>Риск:</b> тот, кто получит контроль над ${esc(c.host)}, сможет без пароля войти на ${ip} под root. Отозвать доступ: удалить строку с ключом <span class="mono">id_rmon</span> роутера ${esc(c.host)} из этого файла на ${ip}.</p></div>
      <label class="ok"><input type="checkbox" id="w-persist" ${S.persist ? 'checked' : ''}> Разрешить постоянный доступ по ключу</label></div>`;
    if (S.busy) h += msg('warning', 'Устанавливаю… Это занимает до минуты, не закрывайте окно.');
    return h;
  }
  function canGo() {
    const c = S.c; if (!c || S.busy) return false;
    if (S.step === 'done') return true;
    if (c.rmon) return true;
    if (!c.ssh) return false;
    return S.ok.ssh && S.ok.chg && (c.key || S.pw.length > 0);
  }
  function render() {
    const c = S.c;
    // «Проверить» — только рядом с полем IP; основная кнопка внизу появляется, когда есть что делать
    const label = S.step === 'done' ? 'Готово' : !c ? '' : c.rmon ? 'Добавить в список' : c.ssh ? 'Установить и добавить' : '';
    dlg.innerHTML = `<div class="mh"><h2>Добавить роутер</h2><span class="spacer"></span><button class="btn" id="w-x" ${S.busy ? 'disabled' : ''} aria-label="Закрыть">✕</button></div>
      <div class="mb">${body()}</div>
      <div class="mf">${S.step === 'done' ? '' : `<button class="btn" id="w-cancel" ${S.busy ? 'disabled' : ''}>Отмена</button>`}${label ? `<button class="btn primary" id="w-go" ${canGo() ? '' : 'disabled'}>${label}</button>` : ''}</div>`;
    const ipEl = $('#w-ip', dlg);
    ipEl.oninput = () => { S.ip = ipEl.value.trim(); };
    ipEl.onkeydown = e => { if (e.key === 'Enter') check(); };
    $('#w-check', dlg).onclick = check;
    $('#w-x', dlg).onclick = close;
    const cn = $('#w-cancel', dlg); if (cn) cn.onclick = close;
    const go = $('#w-go', dlg); if (go) go.onclick = () => S.step === 'done' ? close() : install();
    const upd = () => { if (go) go.disabled = !canGo(); };
    const pw = $('#w-pw', dlg); if (pw) pw.oninput = () => { S.pw = pw.value; upd(); };
    dlg.querySelectorAll('[data-ok]').forEach(x => x.onchange = () => { S.ok[x.dataset.ok] = x.checked; upd(); });
    const ps = $('#w-persist', dlg); if (ps) ps.onchange = () => { S.persist = ps.checked; };
  }
  async function check() {
    S.ip = ($('#w-ip', dlg).value || '').trim(); S.err = ''; S.c = null; S.ok = {}; S.step = 'ip';
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(S.ip)) { S.err = 'Введите IP-адрес вида 192.168.1.10'; render(); return; }
    S.busy = true; render(); $('#w-check', dlg).textContent = 'Проверяю…';
    try { S.c = await api('', 'a=check&ip=' + encodeURIComponent(S.ip)); S.step = 'checked'; }
    catch (e) { S.err = e.message; }
    S.busy = false; render();
  }
  async function install() {
    S.busy = true; S.err = ''; render();
    try {
      S.res = await post('a=add', { ip: S.ip, password: S.c.rmon || S.c.key ? '' : S.pw, persist: !S.c.key && S.persist });
      S.step = 'done'; changed = true;
    } catch (e) { S.err = e.message; }
    S.pw = ''; S.busy = false; render();
  }
  // IP введён в выпадающем списке — сразу проверяем, как по кнопке «Проверить»
  render(); dlg.showModal(); if (S.ip) check(); else setTimeout(() => $('#w-ip', dlg).focus(), 0);
}

go();
</script>
</body>
</html>
